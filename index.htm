<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoavaliação de Design — mudou de endereço</title>

  <link rel="icon" href="https://raw.githubusercontent.com/ProdutosAUVP/reviewdesign/main/meme_this_is_fine_dog.png" type="image/png">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,300,400&display=swap" rel="stylesheet">

  <!-- A autoavaliação passou a morar junto dos outros formulários do time de
       design. Este arquivo existe só para que os links antigos continuem
       chegando lá — sem ele, quem tem a URL guardada cairia numa página vazia. -->
  <link rel="canonical" href="https://produtosauvp.github.io/reviewdesign/#autoavaliacao">
  <meta http-equiv="refresh" content="0; url=https://produtosauvp.github.io/reviewdesign/#autoavaliacao">
  <script>
    // replace() e não href: o botão voltar não fica preso num laço entre as duas páginas
    window.location.replace('https://produtosauvp.github.io/reviewdesign/#autoavaliacao');
  </script>

  <style>
    :root { color-scheme: light dark; }

    body {
      font-family: 'Satoshi', system-ui, sans-serif;
      background: #F9F8F6;
      color: #1C1C1C;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #E0E0E0; }
      .cartao { background: #1A1A1A; border-color: rgba(255,255,255,0.08); }
      .rotulo { color: rgba(255,255,255,0.5); }
      .texto { color: rgba(255,255,255,0.7); }
      .link-secundario { color: rgba(255,255,255,0.5); }
    }

    .cartao {
      background: #FFFFFF;
      border: 1px solid #EAE7E0;
      max-width: 460px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
    }

    .rotulo {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-weight: 700;
      color: #595959;
      margin: 0 0 12px;
    }

    h1 {
      font-size: 30px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      line-height: 0.9;
      margin: 0 0 16px;
    }

    h1 em {
      font-style: italic;
      font-weight: 300;
      letter-spacing: -0.02em;
      color: #38805A;
    }

    .texto {
      font-size: 13px;
      line-height: 1.6;
      color: #595959;
      margin: 0 0 28px;
    }

    .botao {
      display: inline-block;
      background: #38805A;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      padding: 14px 28px;
      transition: opacity .2s ease;
    }

    .botao:hover { opacity: .85; }

    .link-secundario {
      display: block;
      margin-top: 20px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 700;
      color: #595959;
      text-decoration: none;
    }

    .link-secundario:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="cartao">
    <p class="rotulo">Este endereço mudou</p>

    <h1>Autoavaliação de <em>Design.</em></h1>

    <p class="texto">
      A autoavaliação agora fica junto da solicitação de demandas, da avaliação de entregas
      e do painel de resultados, tudo na mesma página do time de design.
      Estamos te levando para lá.
    </p>

    <a class="botao" href="https://produtosauvp.github.io/reviewdesign/#autoavaliacao">
      Ir para a autoavaliação →
    </a>

    <a class="link-secundario" href="https://produtosauvp.github.io/reviewdesign/">
      Ver todos os formulários do time
    </a>
  </main>
</body>
</html>
